<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ 회로 위의 탐험가</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===== START SCREEN ===== -->
    <div id="screen-start" class="screen active">
      <div class="container glass">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 80 80" width="80" height="80">
              <circle cx="40" cy="40" r="36" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="8 4"/>
              <circle cx="40" cy="40" r="20" fill="none" stroke="#3a7bd5" stroke-width="2"/>
              <path d="M40 20 L40 60 M20 40 L60 40" stroke="#00d2ff" stroke-width="2"/>
              <circle cx="40" cy="40" r="6" fill="#00d2ff" opacity="0.6"/>
              <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="8s" repeatCount="indefinite"/>
            </svg>
          </div>
          <h1>회로 위의 탐험가</h1>
          <p class="subtitle">당신의 성향에 맞는<br>전기·전자 분야를 찾아보세요</p>
        </div>

        <div class="input-group">
          <label>이름</label>
          <input type="text" id="input-name" placeholder="홍길동" maxlength="20">
        </div>

        <div class="row">
          <div class="input-group half">
            <label>성별</label>
            <select id="input-gender">
              <option value="남성">남성</option>
              <option value="여성">여성</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div class="input-group half">
            <label>나이</label>
            <input type="number" id="input-age" placeholder="25" min="1" max="120">
          </div>
        </div>

        <div class="input-group">
          <label>MBTI</label>
          <div class="mbti-row" id="mbti-row">
            <div class="mbti-seg"><select class="mbti-ei"><option value="E">E</option><option value="I">I</option></select><span>외향/내향</span></div>
            <div class="mbti-seg"><select class="mbti-sn"><option value="S">S</option><option value="N">N</option></select><span>감각/직관</span></div>
            <div class="mbti-seg"><select class="mbti-tf"><option value="T">T</option><option value="F">F</option></select><span>사고/감정</span></div>
            <div class="mbti-seg"><select class="mbti-jp"><option value="J">J</option><option value="P">P</option></select><span>판단/인식</span></div>
          </div>
        </div>

        <button id="btn-start" class="btn btn-primary" onclick="startQuiz()">⚡ 탐험 시작하기</button>
        <p class="hint">키보드 1/2 키로도 답변할 수 있습니다</p>
      </div>
    </div>

    <!-- ===== QUESTION SCREEN ===== -->
    <div id="screen-question" class="screen">
      <div class="container glass">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="question-counter" id="question-counter">1 / 5</div>

        <div class="question-card" id="question-card">
          <div class="q-number" id="q-number">Q1</div>
          <h2 id="question-text"></h2>

          <div class="options">
            <button class="option-btn" onclick="selectAnswer('A')" data-key="1">
              <span class="option-key">1</span>
              <span class="option-letter">A</span>
              <span class="option-text" id="option-a"></span>
            </button>
            <button class="option-btn" onclick="selectAnswer('B')" data-key="2">
              <span class="option-key">2</span>
              <span class="option-letter">B</span>
              <span class="option-text" id="option-b"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="screen-loading" class="screen">
      <div class="container glass loading-container">
        <div class="loader">
          <svg viewBox="0 0 100 100" width="120" height="120">
            <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="#00d2ff" stroke-width="4" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round">
              <animate attributeName="stroke-dashoffset" from="251.2" to="0" dur="2s" fill="freeze"/>
            </circle>
            <circle cx="50" cy="50" r="20" fill="none" stroke="#3a7bd5" stroke-width="3" stroke-dasharray="125.6" stroke-dashoffset="125.6">
              <animate attributeName="stroke-dashoffset" from="125.6" to="0" dur="2s" begin="1s" fill="freeze"/>
            </circle>
          </svg>
        </div>
        <p class="loading-text" id="loading-text">분석 중...</p>
      </div>
    </div>

    <!-- ===== PDF GENERATING OVERLAY ===== -->
    <div id="screen-pdfgen" class="screen">
      <div class="container glass loading-container">
        <div class="loader">
          <svg viewBox="0 0 100 100" width="90" height="90">
            <rect x="20" y="20" width="60" height="60" rx="6" fill="none" stroke="#00d2ff" stroke-width="3"/>
            <path d="M35 50 L48 63 L68 38" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.2s" fill="freeze"/>
            </path>
          </svg>
        </div>
        <p class="loading-text">PDF 생성 중...</p>
      </div>
    </div>

    <!-- ===== RESULT SCREEN ===== -->
    <div id="screen-result" class="screen">
      <div class="container glass result-container">
        <div class="result-header">
          <div class="result-icon">⚡</div>
          <h1>탐험 완료!</h1>
          <div class="user-badge" id="user-badge"></div>
        </div>

        <div class="result-card" id="result-card"></div>

        <div class="result-actions" id="result-actions">
          <button class="btn btn-download" onclick="downloadPdf()">📄 PDF 저장</button>
          <button class="btn btn-secondary" onclick="resetQuiz()">🔄 다시 탐험하기</button>
        </div>
        <p class="hint" id="pdf-hint" style="display:none">PDF가 서버에 저장되었습니다</p>
      </div>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
